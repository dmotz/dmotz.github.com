<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=block"
      rel="stylesheet"
    />

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Dan Motzenbecker" />
    <meta name="author" content="Dan Motzenbecker" />
    <noscript
      ><style>
        body {
          opacity: 1;
        }
      </style></noscript
    >
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      ;(() => {
        let shown = false
        const show = () => {
          if (shown) {
            return
          }

          shown = true
          requestAnimationFrame(() => {
            document.body.classList.add('fonts-loaded')
          })
        }

        const timeout = setTimeout(show, 3000)

        Promise.all([
          document.fonts.load('400 1em "EB Garamond"'),
          document.fonts.ready
        ])
          .catch(() => {})
          .finally(() => {
            clearTimeout(timeout)
            show()
          })
      })()
    </script>
  </body>
</html>
