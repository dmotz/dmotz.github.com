name: Deploy to GitHub Pages

on:
  push:
    branches: master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: enable corepack
        run: corepack enable

      - name: install node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: cache optimized media
        uses: actions/cache@v5
        with:
          path: src/lib/media
          key: media-${{ runner.os }}-${{ hashFiles('scripts/optimize-media.js', 'media-src/**') }}
          restore-keys: |
            media-${{ runner.os }}-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build
        run: pnpm run build

      - name: upload artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/'
          include-hidden-files: true

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
